steps:
  # 이전 빌드 이미지를 받아 레이어 캐시로 사용 (첫 빌드에는 없으므로 실패해도 계속 진행)
  - name: gcr.io/cloud-builders/docker
    id: Pull cache
    entrypoint: bash
    args:
      - '-c'
      - |
        docker pull $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:builder || true
        docker pull $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest || true

  # 의존성 빌드 결과가 담긴 builder 단계를 따로 태그해 다음 빌드의 캐시로 남긴다.
  # 최종 이미지에는 builder 단계 레이어가 없으므로 이 단계가 없으면 캐시가 동작하지 않는다.
  - name: gcr.io/cloud-builders/docker
    id: Build builder stage
    args:
      - build
      - '--target'
      - builder
      - '--build-arg'
      - BUILDKIT_INLINE_CACHE=1
      - '--cache-from'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:builder'
      - '-t'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:builder'
      - '-f'
      - Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - '--build-arg'
      - BUILDKIT_INLINE_CACHE=1
      - '--cache-from'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:builder'
      - '--cache-from'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest'
      - '-t'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest'
      - '-f'
      - Dockerfile
      - .
images:
  - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
  - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest'
  - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:builder'
substitutions:
  _AR_HOSTNAME: 'asia-northeast3-docker.pkg.dev'
  _AR_PROJECT_ID: 'jk6841'
  _AR_REPOSITORY: 'cloud-run-source-deploy'
  _REPO_NAME: 'kaist-seoul-meals'
  _SERVICE_NAME: 'kaist-seoul-meals'
tags:
  - kaist-seoul-meals
options:
  logging: CLOUD_LOGGING_ONLY
